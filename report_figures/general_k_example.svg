<rect x="397" y="353" width="579" height="305" rx="8" fill="#f3f7fb" stroke="none"/>
<text x="420" y="388" font-family="Arial, sans-serif" font-size="22" fill="#1f4e79" text-anchor="start" font-weight="bold">3. Read off the exact Fourier mass</text>
<text x="420" y="426" font-family="Arial, sans-serif" font-size="20" fill="#24384b" text-anchor="start" font-weight="normal">Ideal outcomes: G = {0, 5, 10}</text>
<text x="420" y="468" font-family="Arial, sans-serif" font-size="20" fill="#24384b" text-anchor="start" font-weight="normal">P(G) = (r / N²) × sum of squared counts</text>
<text x="420" y="505" font-family="Arial, sans-serif" font-size="22" fill="#276442" text-anchor="start" font-weight="bold">         = (3 / 225) × 25 = 1/3</text>
<text x="420" y="550" font-family="Arial, sans-serif" font-size="18" fill="#24384b" text-anchor="start" font-weight="normal">The theorem guarantees at least</text>
<text x="420" y="584" font-family="Arial, sans-serif" font-size="22" fill="#1f4e79" text-anchor="start" font-weight="bold">r / ((k + 1)r + I) = 3/14</text>
<text x="420" y="628" font-family="Arial, sans-serif" font-size="18" fill="#5d6c79" text-anchor="start" font-weight="normal">This also exceeds the universal bound 1/7.</text>
